<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- Shield with Offer Tag Icon -->
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0B2A6F" />
    </linearGradient>
    <linearGradient id="tagGrad" x1="16" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Background -->
  <path d="M24 6 C35 6, 42 10, 42 10 C42 26, 33 41, 24 46 C15 41, 6 26, 6 10 C6 10, 13 6, 24 6 Z" fill="url(#shieldGrad)" />
  
  <!-- Spark / Discount Tag Inside -->
  <path d="M21 16 L29 16 C30.6 16, 32 17.4, 32 19 L32 23 L25 30 L19 24 L25 18 L21 18 C19.9 18, 19 18.9, 19 20 Z" fill="url(#tagGrad)" />
  <circle cx="28" cy="19.5" r="1.5" fill="#FFFFFF" />
  
  <!-- Star Accent -->
  <path d="M36 12 L37.5 15.5 L41 17 L37.5 18.5 L36 22 L34.5 18.5 L31 17 L34.5 15.5 Z" fill="#FFB800" />

  <!-- Typography -->
  <text x="52" y="31" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-weight="800" font-size="22" fill="#0B2A6F" letter-spacing="-0.5">SAGALA</text>
  <text x="144" y="31" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-weight="700" font-size="22" fill="#1D4ED8" letter-spacing="-0.5">SERVICE</text>
  
  <!-- Tagline -->
  <rect x="52" y="36" width="70" height="13" rx="3" fill="#EAF2FF" />
  <text x="56" y="46" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="8" fill="#1D4ED8" letter-spacing="0.8">MADURAI OFFERS</text>
  <text x="128" y="46" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="8" fill="#FF8A00">● LIVE FEED</text>
